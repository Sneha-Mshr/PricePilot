spring.application.name=backend

# Cloud platforms inject the port to bind to.
server.port=${PORT:8080}

# MongoDB connection string (database name comes from the URI itself).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pricepilot}

# Comma-separated frontend origins allowed to call this API.
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# HMAC signing key for JWTs. MUST be overridden in production.
app.jwt.secret=${JWT_SECRET:dev_only_pricepilot_secret_key_change_me_in_production_32b}

# Token lifetime in milliseconds (default 24h).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Base URL of the FastAPI AI service.
app.fastapi.url=${FASTAPI_URL:http://localhost:8000}
