# Local development stack: Postgres + MongoDB + both backends.
#
#   docker compose up --build
#
# The Next.js frontend still runs on the host with `npm run dev`, pointing at
# http://127.0.0.1:8000 and http://127.0.0.1:8080 (the defaults).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pricepilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pricepilot
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build: ./spring-backend/backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/pricepilot
      JWT_SECRET: local_dev_secret_key_at_least_32_bytes_long_ok
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FASTAPI_URL: http://api:8000
    depends_on:
      - mongo
      - api

volumes:
  pgdata:
  mongodata:
